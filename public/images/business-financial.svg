<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0E13"/><stop offset="100%" stop-color="#10060B"/>
    </linearGradient>
    <linearGradient id="bglow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#A81E3C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A81E3C" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bclip"><rect width="800" height="500"/></clipPath>
  </defs>
  <g clip-path="url(#bclip)">
    <rect width="800" height="500" fill="url(#bg2)"/>
    <circle cx="120" cy="430" r="330" fill="url(#bglow)"/>
    <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
      <path d="M0 100H800M0 200H800M0 300H800M0 400H800"/>
      <path d="M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500"/>
    </g>
    <!-- growth arc -->
    <path d="M70 400 C 240 400, 300 250, 420 190 S 640 130, 740 90"
          stroke="#A81E3C" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M70 400 C 240 400, 300 250, 420 190 S 640 130, 740 90 L740 460 L70 460 Z"
          fill="#A81E3C" fill-opacity="0.13"/>
    <!-- nodes -->
    <g>
      <circle cx="70"  cy="400" r="9" fill="#FFFFFF" fill-opacity="0.55"/>
      <circle cx="300" cy="252" r="9" fill="#FFFFFF" fill-opacity="0.7"/>
      <circle cx="520" cy="160" r="9" fill="#FFFFFF" fill-opacity="0.85"/>
      <circle cx="740" cy="90"  r="13" fill="#FFFFFF"/>
      <circle cx="740" cy="90"  r="26" fill="#FFFFFF" fill-opacity="0.14"/>
    </g>
    <!-- capital blocks -->
    <g transform="translate(96 150)">
      <rect x="0"  y="60" width="86" height="86" rx="14" fill="#FFFFFF" fill-opacity="0.16"/>
      <rect x="52" y="8"  width="86" height="86" rx="14" fill="#FFFFFF" fill-opacity="0.26"/>
      <g transform="translate(52 8)" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M43 62V26"/>
        <path d="M27 42 43 26 59 42"/>
      </g>
    </g>
    <!-- shield -->
    <g transform="translate(560 300)">
      <path d="M60 0 108 18v40c0 30-21 52-48 60-27-8-48-30-48-60V18Z" fill="#A81E3C"/>
      <path d="M40 60l14 14 28-28" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
