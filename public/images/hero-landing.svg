<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" width="720" height="580" role="img">
  <defs>
    <radialGradient id="hglow" cx="50%" cy="40%" r="62%">
      <stop offset="0%"   stop-color="#D8244D" stop-opacity="0.58"/>
      <stop offset="55%"  stop-color="#D8244D" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#D8244D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hcard" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F4EFF1"/>
    </linearGradient>
    <linearGradient id="hdark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2530"/><stop offset="100%" stop-color="#141218"/>
    </linearGradient>
    <filter id="hshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="hshadow2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <ellipse cx="368" cy="240" rx="330" ry="280" fill="url(#hglow)"/>

  <!-- roof watermark, echoing the logo mark -->
  <g opacity="0.15">
    <polygon points="368,40 110,222 110,188 368,6" fill="#FFFFFF"/>
    <polygon points="368,40 626,222 626,188 368,6" fill="#D8244D"/>
    <rect x="530" y="98" width="40" height="58" fill="#D8244D"/>
  </g>

  <!-- ascending bars, raised so they read above the floating card -->
  <g transform="translate(474 176)">
    <rect x="0"   y="128" width="40" height="112" rx="7" fill="#FFFFFF" fill-opacity="0.12"/>
    <rect x="56"  y="88"  width="40" height="152" rx="7" fill="#FFFFFF" fill-opacity="0.17"/>
    <rect x="112" y="44"  width="40" height="196" rx="7" fill="#D8244D" fill-opacity="0.6"/>
    <rect x="168" y="0"   width="40" height="240" rx="7" fill="#D8244D" fill-opacity="0.9"/>
    <path d="M20 128 L76 88 L132 44 L188 0" stroke="#FFFFFF" stroke-opacity="0.55"
          stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="188" cy="0" r="7" fill="#FFFFFF"/>
  </g>

  <!-- main return document -->
  <g transform="translate(84 122) rotate(-4 150 190)" filter="url(#hshadow)">
    <rect width="300" height="380" rx="16" fill="url(#hcard)"/>
    <rect x="34" y="38" width="118" height="15" rx="7.5" fill="#D8244D"/>
    <rect x="34" y="70" width="76"  height="9"  rx="4.5" fill="#0D0B0D" fill-opacity="0.22"/>
    <g fill="#0D0B0D" fill-opacity="0.13">
      <rect x="34" y="112" width="232" height="10" rx="5"/>
      <rect x="34" y="140" width="196" height="10" rx="5"/>
      <rect x="34" y="168" width="216" height="10" rx="5"/>
    </g>
    <rect x="34" y="204" width="232" height="1.6" fill="#0D0B0D" fill-opacity="0.10"/>
    <g fill="#0D0B0D" fill-opacity="0.13">
      <rect x="34" y="226" width="160" height="10" rx="5"/>
      <rect x="34" y="254" width="204" height="10" rx="5"/>
      <rect x="34" y="282" width="130" height="10" rx="5"/>
    </g>
    <rect x="34" y="318" width="232" height="1.6" fill="#0D0B0D" fill-opacity="0.10"/>
    <rect x="34" y="338" width="92" height="13" rx="6.5" fill="#0D0B0D" fill-opacity="0.32"/>
    <rect x="196" y="334" width="70" height="20" rx="10" fill="#D8244D"/>
  </g>

  <!-- floating "filed and confirmed" card -->
  <g transform="translate(276 372)" filter="url(#hshadow2)">
    <rect width="292" height="152" rx="18" fill="url(#hdark)" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <g transform="translate(26 30)">
      <circle cx="23" cy="23" r="23" fill="#D8244D"/>
      <path d="M13.5 23.5l6.8 6.8L33 17.5" stroke="#FFFFFF" stroke-width="3.8" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="62" y="7"  width="144" height="11" rx="5.5" fill="#FFFFFF" fill-opacity="0.88"/>
      <rect x="62" y="29" width="98"  height="9"  rx="4.5" fill="#FFFFFF" fill-opacity="0.38"/>
      <rect x="0"  y="72" width="240" height="1.6" fill="#FFFFFF" fill-opacity="0.14"/>
      <rect x="0"  y="90" width="116" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.6"/>
      <rect x="182" y="88" width="58" height="18" rx="9" fill="#D8244D"/>
    </g>
  </g>
</svg>
