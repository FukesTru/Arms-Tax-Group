      <stop offset="0%" stop-color="#1A0E13"/><stop offset="100%" stop-color="#10060B"/>
    </linearGradient>
    <linearGradient id="tglow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#A81E3C" stop-opacity="0.55"/>
